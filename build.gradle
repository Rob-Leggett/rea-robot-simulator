plugins {
    id 'java'
    id 'application'
}

version = '1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

application {
    mainClass = 'com.reagroup.robot.simulator.Application'
}

configurations {
    mockitoAgent
}

dependencies {
    implementation 'ch.qos.logback:logback-classic:1.6.5'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    mockitoAgent('org.mockito:mockito-core:5.24.0') {
        transitive = false
    }
}

testing {
    suites {
        test {
            useJUnitJupiter('6.1.3')
        }

        integrationTest(JvmTestSuite) {
            useJUnitJupiter('6.1.3')
            sources {
                java {
                    srcDirs = ['src/integration-test/java']
                }
                resources {
                    srcDirs = ['src/integration-test/resources']
                }
            }
            dependencies {
                implementation project()
            }
            targets {
                all {
                    testTask.configure {
                        shouldRunAfter(test)
                        outputs.upToDateWhen { false }
                    }
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn testing.suites.integrationTest
}

// Mockito's inline mock maker must be attached as a Java agent on JDK 21+.
tasks.named('test') {
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}", "-Xshare:off"
}

// create a single Jar with all dependencies
tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Assembles an executable jar containing the application and all of its dependencies.'
    archiveBaseName = "${project.name}-all"
    manifest {
        attributes 'Main-Class': application.mainClass
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/*/module-info.class', 'module-info.class'
}

tasks.named('assemble') {
    dependsOn tasks.named('fatJar')
}
